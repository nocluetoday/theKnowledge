<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Knowledge Clipper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="page-title">Loading…</h1>
        <p id="page-kind" class="meta"></p>
      </header>

      <div class="actions">
        <button id="clip" type="button" disabled>Clip full text</button>
        <button id="summarize" type="button" class="primary" disabled>Summarize</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <pre id="preview" class="preview" hidden></pre>

      <footer>
        <button id="settings" type="button" class="link">Settings</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
